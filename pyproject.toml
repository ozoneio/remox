[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remox"
version = "0.1.0"
description = "Beat-aware music retargeting: re-edit a track to an arbitrary target duration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Ozc" }]
keywords = ["audio", "music", "remix", "beat-tracking", "mir", "retargeting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
vocals = ["demucs>=4.0", "torch>=2.0"]
youtube = ["yt-dlp>=2024.1.1", "imageio-ffmpeg>=0.4.9"]

[project.scripts]
remox = "remox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
