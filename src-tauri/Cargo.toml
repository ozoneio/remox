[package]
name = "remox-desktop"
version = "0.2.0"
description = "Local, independently implemented musical duration remixing"
edition = "2021"
license = "MIT"

[lib]
name = "remox_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "remox-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = { version = "0.4", features = ["kv"] }
thiserror = "2"
rustfft = "6"
hound = "3.5"
symphonia = { version = "0.5.5", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
